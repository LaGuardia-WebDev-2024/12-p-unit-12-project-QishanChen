<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <style>
      body {font-family: Arial, sans-serif;}
      h1 {margin-bottom: 20px;}
    </style>
  </head>
  
  <body>
    <button id="mem1-button">Memory #1</button>
    <button id="mem2-button">Memory #2</button>
    <button id="mem3-button">Memory #3</button>
    <h1>My Top 3 Memories of <span>This Year</span></h1>

    <ol>
      <li>
        <h3 id="mem1">Memory #1</h3>
        <p>Closing Night for the Opera</p>
        <img id="img1">
      </li>

      <li>
        <h3 id="mem2">Memory #2</h3>
        <p>Opening my college acceptance</p>
        <img class="img2">
      </li>

      <li>
        <h3 id="mem3">Memory #3</h3>
        <p>Opening Night for Into The Woods</p>
        <img id="img3">
      </li>
    </ol>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
     
      
      $("#mem1-button").click(function () {
        $("#mem1").css("color", "purple");
        $("#mem1").css("font-weight", "bold");
      });
      

      $("#mem2-button").click(function () {
        $("#mem2").css("color", "blue");
        $("#mem2").css("background-color", "#f0f8ff");
      });
      

      $("#mem3-button").click(function () {
        $("#mem3").css("color", "green");
        $("#mem3").css("font-style", "italic");
      });

      
      $(".img2").css("border", "2px solid gray");

     
      $("h1").css("text-align", "center");
      
            
       $("#img1").attr(
      "src",
          "https://cdn.glitch.global/9c7acd4d-38c4-4b57-812f-4d0b4cc13a0c/IMG_9337.jpeg?v=1746105230136"); 
       
       $(".img2").attr(
        "src",
          "https://cdn.glitch.global/9c7acd4d-38c4-4b57-812f-4d0b4cc13a0c/IMG_9484.jpeg?v=1746105199375");
       
       $("#img3").attr(
        "src",
          "https://cdn.glitch.global/9c7acd4d-38c4-4b57-812f-4d0b4cc13a0c/5B0DFFEC-074D-4856-94A6-1D8001B96C2D_1_105_c%20(1).jpeg?v=1746105117405 "   );
      
         
    </script>
  </body>
</html>
